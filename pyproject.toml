[project]
name = "shopsphere-temporal"
version = "1.0.0"
description = "Durable retail order fulfillment and AI customer support on Temporal, with LangGraph, LangChain and Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anjaiah Methuku" }]
dependencies = [
    "temporalio[langgraph,deepagents]>=1.34.0",
    "deepagents>=0.7.23",
    "langgraph>=1.2.14",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13",
    "httpx>=0.28",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.7.0"]
anthropic = ["langchain-anthropic>=1.7.5"]
dev = ["pytest>=8.4", "pytest-asyncio>=1.4.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
    "ignore:The default value of `allowed_objects`",
    "ignore:Module .* was imported after initial workflow load",
    # Experimental LangGraph plugin: its interceptor cleanup can fire while
    # evicted workflow coroutines are garbage-collected at worker shutdown.
    # Harmless; see docs/13-testing.md.
    "ignore:Exception ignored in.*run_workflow:pytest.PytestUnraisableExceptionWarning",
]
